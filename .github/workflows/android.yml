name: Android app

# Builds the AnchorTrakk Android app (a Trusted Web Activity wrapper around the
# website; see android/README.md). Runs on any push that touches android/, and on
# demand. Tick "Publish" when running it manually to attach the APK to a GitHub
# release, which is what the website's download button points at.
#
# Optional repository secrets for a properly signed build (without them the
# build is signed with a throwaway debug key and the app shows a browser bar):
#   ANDROID_KEYSTORE_BASE64    the .jks file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the APK as the latest GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME is set).

      - name: Restore signing key (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Release signing key restored."
          else
            echo "No signing key secrets set: building with the debug key."
          fi

      - name: Build APK and app bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect outputs and print the signing fingerprint
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AnchorTrakk.apk
          cp app/build/outputs/bundle/release/app-release.aab out/AnchorTrakk.aab
          ls -l out
          echo "---- Signing certificate of AnchorTrakk.apk ----"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/AnchorTrakk.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: AnchorTrakk-android
          path: android/out/*

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION_NAME}" out/AnchorTrakk.apk out/AnchorTrakk.aab \
            --repo "$GITHUB_REPOSITORY" --latest \
            --title "AnchorTrakk Android ${VERSION_NAME}" \
            --notes "Android app build ${VERSION_NAME}. Install AnchorTrakk.apk on your phone. The .aab is for the Play Store."
