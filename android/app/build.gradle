plugins {
    id 'com.android.application'
}

// Signing comes from the environment (set by .github/workflows/android.yml from
// repository secrets), never from files in the repo. With no keystore the
// release build is signed with the throwaway debug key, which is fine for trying
// the app but will NOT pass Digital Asset Links verification (see android/README.md).
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseKey = keystorePath != null && new File(keystorePath).exists()

android {
    namespace 'ng.com.anchortrakk.twa'
    compileSdk 34

    defaultConfig {
        applicationId 'ng.com.anchortrakk.twa'
        minSdk 21
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
